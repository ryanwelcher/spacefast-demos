<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" role="img" aria-label="A ninja peeking over the edge">
  <defs>
    <clipPath id="head">
      <circle cx="100" cy="80" r="52"/>
    </clipPath>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4160"/>
      <stop offset="1" stop-color="#1c2030"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5f63"/>
      <stop offset="1" stop-color="#c8323a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a37c"/>
      <stop offset="0.35" stop-color="#f3c9a3"/>
      <stop offset="1" stop-color="#e8b38b"/>
    </linearGradient>
  </defs>

  <!-- Headband tails, behind the head -->
  <path d="M146 58 C164 50 176 40 196 30 C192 42 182 52 166 60 C178 60 188 66 198 76 C184 76 168 70 150 66 Z" fill="url(#band)"/>
  <path d="M152 60 C168 56 180 48 192 38" fill="none" stroke="#9e2129" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Shoulders -->
  <path d="M34 180 C38 152 56 132 82 126 L118 126 C144 132 162 152 166 180 Z" fill="url(#cloth)"/>
  <path d="M100 128 L100 180" stroke="#161a26" stroke-width="3" opacity="0.5"/>
  <path d="M62 140 C76 150 90 156 100 158 C110 156 124 150 138 140" fill="none" stroke="#161a26" stroke-width="3" opacity="0.45"/>

  <!-- Head (hood) -->
  <circle cx="100" cy="80" r="52" fill="url(#cloth)"/>
  <g clip-path="url(#head)">
    <!-- Shadow on the lower right of the hood -->
    <circle cx="130" cy="104" r="56" fill="#151926" opacity="0.45"/>
    <!-- Headband -->
    <rect x="40" y="44" width="124" height="14" fill="url(#band)"/>
    <rect x="40" y="55" width="124" height="3" fill="#9e2129" opacity="0.7"/>
    <!-- Eye slit -->
    <rect x="50" y="66" width="100" height="26" rx="11" fill="url(#skin)"/>
    <rect x="50" y="66" width="100" height="6" fill="#b9805a" opacity="0.45"/>
    <!-- Mask wrap folds below the slit -->
    <path d="M52 100 C72 108 128 108 148 100" fill="none" stroke="#151926" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M60 114 C78 120 122 120 140 114" fill="none" stroke="#151926" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  </g>
  <!-- Highlight on the hood -->
  <path d="M66 46 C74 36 88 30 100 30" fill="none" stroke="#5a6385" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- Knot -->
  <ellipse cx="148" cy="56" rx="8" ry="7" fill="url(#band)"/>
  <ellipse cx="146" cy="54" rx="3" ry="2" fill="#ff8a8d" opacity="0.7"/>

  <!-- Eyes -->
  <path d="M64 81 C72 72 86 71 94 78 C86 86 72 87 64 81 Z" fill="#ffffff"/>
  <path d="M136 81 C128 72 114 71 106 78 C114 86 128 87 136 81 Z" fill="#ffffff"/>
  <circle cx="86" cy="79" r="4.5" fill="#121521"/>
  <circle cx="114" cy="79" r="4.5" fill="#121521"/>
  <circle cx="87.5" cy="77.5" r="1.4" fill="#ffffff"/>
  <circle cx="115.5" cy="77.5" r="1.4" fill="#ffffff"/>
  <!-- Brows: narrowed, scheming -->
  <path d="M62 71 L94 76" stroke="#121521" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M138 71 L106 76" stroke="#121521" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Gloved hands gripping the edge -->
  <g fill="#262b40">
    <rect x="40" y="160" width="40" height="24" rx="11"/>
    <rect x="120" y="160" width="40" height="24" rx="11"/>
  </g>
  <g stroke="#151926" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <path d="M50 164 L50 176"/><path d="M60 163 L60 176"/><path d="M70 164 L70 176"/>
    <path d="M130 164 L130 176"/><path d="M140 163 L140 176"/><path d="M150 164 L150 176"/>
  </g>
  <path d="M44 166 C52 160 68 160 76 166" fill="none" stroke="#4a5274" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M124 166 C132 160 148 160 156 166" fill="none" stroke="#4a5274" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
</svg>
